<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="google-site-verification" content="aSjY_Ai-Pfq17QcKWQdB44wUdpcB754-4yv02m4ApnU" />
<title>AltWorld Comics</title>
<meta name="description" content="AltWorld Comics — dark pulp, horror, retro comics and original dark tales." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand-wrap" href="#main" data-tab="main" aria-label="AltWorld Comics home">
    <img id="siteLogo" class="site-logo" src="images/logo.png" alt="AltWorld Comics logo" />
    <span id="siteTitle">ALTWORLD COMICS</span>
  </a>
  <nav class="nav" aria-label="Main navigation">
    <button class="nav-link active" data-tab="main">Home</button>
    <button class="nav-link" data-tab="store">Store</button>
    <button class="nav-link" data-tab="about">About</button>
  </nav>
</header>

<main>
<section id="main" class="page-section active-section">
  <section class="hero-strip">
    <img id="heroBanner" src="images/banner.png" alt="AltWorld Comics banner" />
  </section>

  <section class="intro-panel">
    <p id="siteTagline" class="kicker">Old tales. New adventures. Different worlds.</p>
    <p id="siteIntro"></p>
  </section>

  <section class="content-wrap">
    <div class="section-title compact-title">
      <p>Publisher Updates</p>
      <h1>Latest Releases & Updates</h1>
    </div>
    <div id="postsGrid" class="grid posts-grid"></div>
  </section>
</section>

<section id="store" class="page-section">
  <section class="content-wrap page-top">
    <div class="section-title compact-title">
      <p>Digital Releases</p>
      <h1>Store</h1>
    </div>
    <div id="storeGrid" class="grid store-grid"></div>
  </section>
</section>

<section id="about" class="page-section">
  <section class="content-wrap page-top">
    <div class="section-title compact-title">
      <p>Who We Are</p>
      <h1 id="aboutHeading">About AltWorld Comics</h1>
    </div>
    <article class="about-card">
      <p id="aboutBody"></p>
      <div class="about-links">
        <a id="aboutX" href="#" target="_blank" rel="noopener">X / Twitter</a>
        <a id="aboutInstagram" href="#" target="_blank" rel="noopener">Instagram</a>
        <span id="aboutContact"></span>
      </div>
    </article>
  </section>
</section>
</main>

<footer>
  <span>ALTWORLD COMICS</span>
  <span>Old tales. New adventures.</span>
</footer>

<div id="postModal" class="post-modal" aria-hidden="true">
  <div class="post-modal-overlay" onclick="closePost()"></div>
  <div class="post-modal-box" role="dialog" aria-modal="true">
    <button class="modal-close" onclick="closePost()" aria-label="Close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
