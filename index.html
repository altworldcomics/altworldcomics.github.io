<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AltWorld Comics</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <div class="logo-area">
        <img src="images/logo.png" class="logo">
        <div class="brand">ALTWORLD COMICS</div>
    </div>

    <nav class="menu">
        <a class="active">Main Page</a>
        <a>Store</a>
        <a>About</a>
    </nav>
</header>

<section class="hero">
    <img src="images/banner.png" class="hero-banner">
</section>

<section class="content">
    <h2>Latest Releases</h2>

    <div class="cards">
        <div class="card">
            <img src="images/fantomah.jpg">
            <h3>Fantomah — Issue #0</h3>
            <p>Dark jungle horror reborn for a new generation.</p>
        </div>

        <div class="card">
            <img src="images/redhood.jpg">
            <h3>Dark Tales: Little Red Riding Hood</h3>
            <p>Classic fairy tale horror reimagined.</p>
        </div>
    </div>
</section>

</body>
</html>
