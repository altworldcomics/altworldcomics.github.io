<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AltWorld Comics Admin</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{margin:0;background:#070705;color:#f4e9c7;font-family:Arial,sans-serif}main{width:min(1000px,92vw);margin:30px auto}h1{font-family:Georgia,serif;font-size:42px}textarea{width:100%;height:70vh;background:#111;color:#f4e9c7;border:1px solid #6b4b1e;border-radius:12px;padding:18px;font-family:monospace;font-size:14px}button{margin:18px 10px 0 0;background:#6f281d;color:#fff;border:1px solid #d7b85c;border-radius:999px;padding:12px 20px;font-weight:bold;cursor:pointer}.hint{color:#b8a982;line-height:1.6}</style></head><body><main><h1>AltWorld Comics Admin</h1><p class="hint">Edit JSON, download it as <b>data.json</b>, then upload/replace it in GitHub. Images must exist inside <b>images/</b>.</p><textarea id="jsonBox"></textarea><br><button onclick="downloadJson()">Download data.json</button><button onclick="formatJson()">Format JSON</button></main><script>async function load(){const r=await fetch("data.json",{cache:"no-store"});const d=await r.json();jsonBox.value=JSON.stringify(d,null,2)}function formatJson(){jsonBox.value=JSON.stringify(JSON.parse(jsonBox.value),null,2)}function downloadJson(){const blob=new Blob([JSON.stringify(JSON.parse(jsonBox.value),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";a.click()}load();</script></body></html>
